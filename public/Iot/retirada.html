<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechCampus | Validação IoT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#111827;color:#f9fafb;font-family:system-ui,sans-serif;padding:20px}
    .iot-card{width:min(520px,100%);background:#1f2937;border:1px solid #374151;border-radius:20px;padding:clamp(22px,5vw,36px);box-shadow:0 18px 60px #0005}
    .brand{color:#f87171;font-weight:800;letter-spacing:.08em}.token-input{font-size:2rem;letter-spacing:.35em;text-align:center;font-weight:800}
    #resultado{white-space:pre-line}.muted{color:#cbd5e1}
  </style>
</head>
<body>
  <main class="iot-card">
    <p class="brand mb-1">TECHCAMPUS · AAPM</p>
    <h1 class="h3 mb-2">Validação de retirada</h1>
    <p class="muted">Digite o token de 6 dígitos apresentado pelo aluno para validar o pedido.</p>
    <form id="formValidar">
      <label class="form-label" for="token">Token de retirada</label>
      <input id="token" class="form-control token-input mb-3" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
      <button class="btn btn-danger w-100" type="submit">Validar token</button>
    </form>
    <section id="resultado" class="mt-4" aria-live="polite"></section>
    <button id="confirmar" class="btn btn-success w-100 mt-3" type="button" hidden>Confirmar retirada</button>
    <p class="muted small mt-4 mb-0">Esta tela é uma interface de teste da API. Em produção, proteja o dispositivo IoT e utilize uma rede segura.</p>
  </main>
  <script src="/Iot/retirada.js"></script>
</body>
</html>
